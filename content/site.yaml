hero:
  title: Python Rwanda
  eyebrow: Kigali · Rwanda
  tagline: A Python community in Rwanda. Bootcamps, meetups, workshops and webinars for people who build with Python.
  video: /media/video/mku-reel-bg.mp4
  poster: /media/video/mku-reel-poster.jpg

about:
  heading: A community for everyone who writes Python in Rwanda.
  short: Students, developers, researchers and data practitioners. We run bootcamps, meetups, workshops and webinars.
  intro: Python Rwanda brings together students, developers, researchers and data practitioners to learn from each other, build things and grow the Python ecosystem in Rwanda.
  mission: Make it easier for anyone in Rwanda to learn Python, use it in their work, and connect with the people building with it.
  mission_detail: We do that through hands-on training, events that bring people into the same room, and by connecting the local community with the wider African and global Python community.
  collage:
