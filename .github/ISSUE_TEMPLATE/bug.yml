name: Something looks wrong
description: Report a broken page, link or display problem.
labels: [bug]
body:
  - type: input
    id: page
    attributes: { label: Page URL }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "Android, Chrome" }
